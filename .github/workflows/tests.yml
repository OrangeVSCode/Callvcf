name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip openpyxl
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py vcf_service.py advanced_analysis.py phenotype_engine.py start_local.py
