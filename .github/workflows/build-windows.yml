name: build-windows

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pyinstaller openpyxl
      - run: python -m unittest discover -s tests -v
      - name: Build local executable
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --name GPA-Accelerator
          --add-data "static;static" start_local.py
      - uses: actions/upload-artifact@v4
        with:
          name: GPA-Accelerator-Windows
          path: dist/GPA-Accelerator.exe
      - name: Attach executable to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GPA-Accelerator.exe
